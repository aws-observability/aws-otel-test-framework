name: Update Test Images

# We should execute only one workflow run at a time
concurrency: 
  group: test_images_concurrency
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches: ['terraform']

    # List of paths that should be considered when triggering the workflow
    paths: ['mocked_servers/**', 'sample-apps/**']

permissions:
  id-token: write
  contents: read

jobs:
  run-image-build:
    runs-on: ubuntu-latest
    steps:
      - name: Remove cache
        run: rm -rf /opt/hostedtoolcache
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838 #v5.0.0
        with:
          role-to-assume: ${{ secrets.TEST_FW_ASSUMABLE_ROLE_ARN }}
          aws-region: us-west-2
          role-duration-seconds: 7200
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 #v5.0.0
        with:
          distribution: 'zulu'
          java-version: 17
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a #4.4.3
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a #4.4.3

        name: Build locally with gradle
        run: ./gradlew build

      - name: Set up terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd #v3.1.2
        with:
          terraform_version: "1.5.7"
      - name: run imagebuild
        working-directory: terraform/imagebuild
        run: |
          terraform init && terraform apply --auto-approve
